name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'setup.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'src/**', 'setup.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

# PR builds supersede each other; pushes to main feed the deploy and must not
# be cancelled halfway. The Pages deploy has its own group, on the deploy job.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.11+ required: client/config.py imports tomli at module level below
          # that, and the package is not installed here (see below).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # The package is deliberately NOT installed. docs/conf.py puts src/ on
      # sys.path, and every module imports with only Sphinx present because all
      # third-party imports in the package are lazy. That makes this build a
      # tripwire: add a module-level `import boto3` and the docs go red.
      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build (warnings are errors)
        run: make -C docs html

      - name: Every module must be in the API reference exactly once
        run: make -C docs coverage

      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7

      - uses: actions/configure-pages@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      # Artifact-based deploy, so no .nojekyll is needed for _static/_sources.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
